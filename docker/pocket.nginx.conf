server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  autoindex off;

  # A phone on cellular pays for bytes, and the bundle is plain JavaScript and CSS.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain image/svg+xml application/javascript application/json application/manifest+json;

  # The page and the worker are revalidated on every load, so a new release lands
  # on the next open instead of living in a stale cache forever.
  location = /index.html {
    include /etc/nginx/snippets/wageroute-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /sw.js {
    include /etc/nginx/snippets/wageroute-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/wageroute-headers.conf;
    add_header Cache-Control "no-cache" always;
    # A manifest served as text/plain makes Chrome refuse the install prompt,
    # and not every nginx mime list names this extension.
    default_type application/manifest+json;
  }

  # These filenames contain their own content hash, so they can never be stale.
  location /assets/ {
    include /etc/nginx/snippets/wageroute-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    include /etc/nginx/snippets/wageroute-headers.conf;
    add_header Cache-Control "no-cache" always;
    # There is no client-side router to fall back to: an unknown path is an
    # unknown path.
    try_files $uri $uri/ =404;
  }

  location ~ /\. {
    return 404;
  }
}
