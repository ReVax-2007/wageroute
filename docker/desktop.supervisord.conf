; Four processes, one container: an X display, the app that draws on it, a VNC
; server that only ever speaks to loopback, and the browser bridge on port 6080.
; Every log goes to the container's stdout so `docker logs` is the whole story.

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_WAGEROUTE_SCREEN)s -nolisten tcp
priority=100
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:desktop]
; --no-sandbox: the container has no user namespace for Chromium's sandbox, and
; running it with the sandbox enabled is what makes Electron refuse to start here.
; --disable-dev-shm-usage: /dev/shm is 64 MB unless the run raises it, and Electron
; dies mid-paint when the shared memory it needs is not there.
command=/opt/wageroute/wageroute --no-sandbox --disable-dev-shm-usage --disable-gpu
environment=HOME="/data",DISPLAY="%(ENV_DISPLAY)s"
priority=200
startsecs=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc]
; Supervisor starts this the moment Xvfb is spawned, not the moment the display
; exists, and x11vnc exits 1 on a display it cannot open. Autorestart recovered
; from that every time, but the container log opened with "was unable to open
; the X DISPLAY", which reads like a broken install to whoever is watching. So
; wait for Xvfb's socket, bounded — if it never appears, give up and let
; supervisor's own restart budget report the failure rather than looping quietly
; forever. exec then replaces the shell, so the pid supervisor tracks is x11vnc
; itself: a measured version that kept a shell wrapper beside its child left an
; orphan holding port 5900 after `supervisorctl stop`, and every later attempt
; then failed with "Address already in use" and retry-spinned forever.
command=/bin/sh -c 'i=0; until [ -e "/tmp/.X11-unix/X${DISPLAY#:}" ]; do i=$(($i+1)); [ $i -ge 60 ] && exit 1; sleep 1; done; sleep 1; exec /usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -localhost -rfbport 5900 -rfbauth /run/wageroute/vnc.pass'
priority=300
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=400
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
