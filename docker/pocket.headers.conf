# nginx only inherits add_header while a nested level declares none of its own,
# so every location below that sets its own Cache-Control has to include this
# file again. That is deliberate repetition, not an oversight.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
