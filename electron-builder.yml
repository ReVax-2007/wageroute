appId: com.wageroute.desktop
productName: WageRoute
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
npmRebuild: true
afterPack: scripts/adhoc-sign.js
mac:
  category: public.app-category.finance
  identity: null
  icon: build/icon.icns
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    # Portable single-file exe and unpack-and-run zip, for users who cannot
    # or do not want to run the NSIS installer. All three are unsigned.
    - target: portable
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WageRoute
linux:
  icon: build/icon.png
  category: Office
  maintainer: Xavier Voet
  # AppImage runs on any distro without root; deb and rpm cover the two big
  # package-manager families. All unsigned; distros may warn on install.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
