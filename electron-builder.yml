appId: com.wageroute.desktop
productName: WageRoute
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
# The licence is not part of the asar, so it ships next to the binary where a
# user can actually read it.
extraResources:
  - from: LICENSE
    to: LICENSE
asarUnpack:
  - '**/*.node'
npmRebuild: true
# Runs after fuses are flipped and after electron-builder's signing step, so
# the ad-hoc signature covers the final binary. Signing in afterPack would be
# invalidated by the fuse flip that follows it.
afterSign: scripts/adhoc-sign.js
# Flipped before the ad-hoc signature in scripts/adhoc-sign.js. The packaged
# binary is a ledger, not a Node runtime: it must not be launchable as node,
# must not read NODE_OPTIONS or --inspect, and must load only the signed asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Architectures are chosen on the command line, not per target: an `arch` list
# here would be merged into every build, so `--linux --x64` would still emit
# arm64 artifacts. The npm scripts and CI pass the flags explicitly.
mac:
  category: public.app-category.finance
  identity: null
  icon: build/icon.icns
  darkModeSupport: true
  target:
    - dmg
win:
  icon: build/icon.png
  target:
    - nsis
    # MSI for managed deployment (Group Policy, Intune, SCCM). WiX only runs
    # on Windows, so this target is built by the windows-latest CI job.
    - msi
    # Portable single-file exe and unpack-and-run zip, for users who cannot
    # or do not want to run an installer. All of these are unsigned.
    - portable
    - zip
# Pinned so release assets have one predictable name per platform and
# architecture instead of inheriting electron-builder's per-target defaults.
dmg:
  artifactName: WageRoute-${version}-${arch}.dmg
nsis:
  artifactName: WageRoute.Setup.${version}-${arch}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WageRoute
msi:
  artifactName: WageRoute-${version}-${arch}.msi
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  shortcutName: WageRoute
portable:
  artifactName: WageRoute-${version}-${arch}.portable.exe
linux:
  icon: build/icon.png
  category: Office
  maintainer: Xavier Voet
  # AppImage runs on any distro without root; deb and rpm cover the two big
  # package-manager families. All unsigned; distros may warn on install.
  target:
    - AppImage
    - deb
    - rpm
appImage:
  artifactName: WageRoute-${version}-${arch}.AppImage
deb:
  artifactName: WageRoute-${version}-${arch}.deb
rpm:
  artifactName: WageRoute-${version}-${arch}.rpm
