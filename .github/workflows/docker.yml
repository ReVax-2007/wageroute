name: Container images

# Builds the two images in docker/ and publishes them to ghcr.io.
#
# A tag push publishes `<version>` and `latest`; a manual run publishes
# `sha-<commit>` only, because between releases package.json still carries the
# last released number and a run from main must not overwrite it. A manual run
# given a release tag (`v1.4.0`) builds that tag's source with this workflow and
# publishes its `<version>` and `latest`: that is how a release whose image job
# failed is republished without moving the tag.
#
# The first push creates the package as **private**. Making it public, or linking
# it to this repository, is an owner action in the package settings — this
# workflow cannot do it and does not try.
#
# No third-party action is used here: the runner's own docker CLI logs in and
# pushes, so this file adds nothing to the supply chain beyond the pinned checkout.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to republish (e.g. v1.4.0). Empty publishes sha-<commit> from the chosen branch.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wageroute-pocket
            dockerfile: docker/pocket.Dockerfile
          - image: wageroute-desktop
            dockerfile: docker/desktop.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Decide the tags
        id: tags
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${TAG_INPUT}"
          fi
          if [ -n "${RELEASE_TAG}" ] && [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "The tag ${RELEASE_TAG} does not match package.json (${VERSION})." >&2
            exit 1
          fi
          OWNER=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          BASE="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          if [ -n "${RELEASE_TAG}" ]; then
            echo "release=${BASE}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "release=${BASE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "latest=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          set -euo pipefail
          TAGS=(-t "${{ steps.tags.outputs.release }}")
          if [ -n "${{ steps.tags.outputs.latest }}" ]; then
            TAGS+=(-t "${{ steps.tags.outputs.latest }}")
          fi
          docker build -f "${{ matrix.dockerfile }}" "${TAGS[@]}" .

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${{ steps.tags.outputs.release }}"
          if [ -n "${{ steps.tags.outputs.latest }}" ]; then
            docker push "${{ steps.tags.outputs.latest }}"
          fi
