name: Test Winget Manifest

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  validate-and-install:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Local Manifests in Winget
        run: winget settings --enable LocalManifestFiles
        shell: pwsh

      - name: Validate Manifest
        run: winget validate --manifest "manifests/r/ReVax-2007/WagerRoute/1.3.1"
        shell: pwsh

      - name: Test Local Installation
        run: winget install --manifest "manifests/r/ReVax-2007/WagerRoute/1.3.1" --silent --accept-package-agreements --accept-source-agreements
        shell: pwsh

      - name: Verify Package Installed
        run: winget list --id ReVax-2007.WagerRoute
        shell: pwsh
