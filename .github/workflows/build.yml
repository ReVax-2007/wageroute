name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            name: mac
            artifact: release/*.dmg
          - os: windows-latest
            target: win
            name: win
            artifact: |
              release/*.exe
              release/*.zip
          - os: ubuntu-latest
            target: linux
            name: linux-x64
            artifact: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - os: ubuntu-24.04-arm
            target: linux
            name: linux-arm64
            artifact: |
              release/*.AppImage
              release/*.deb
              release/*.rpm

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: wageroute-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
