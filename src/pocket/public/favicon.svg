<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="WageRoute">
  <!-- The WageRoute mark. Source of truth for every logo and app icon:
       scripts/icons.mjs renders the PNG, ICNS and ICO files from this. -->
  <defs>
    <linearGradient id="wr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b38" />
      <stop offset="1" stop-color="#05080f" />
    </linearGradient>
    <linearGradient id="wr-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3266" stop-opacity="0.5" />
      <stop offset="0.75" stop-color="#1c3060" stop-opacity="0" />
    </linearGradient>
    <filter id="wr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#wr-bg)" />
  <rect x="128" y="128" width="768" height="768" rx="168" fill="url(#wr-panel)" />

  <g filter="url(#wr-glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 362V474L210 862M300 450L390 622M512 482L618 662L726 454" stroke="#33d690" stroke-width="38" />
    <circle cx="283" cy="406" r="40" fill="#123a35" stroke="#79e1a9" stroke-width="24" />
    <circle cx="512" cy="308" r="40" fill="#123552" stroke="#4cc2ff" stroke-width="24" />
    <circle cx="740" cy="406" r="40" fill="#3b3420" stroke="#f5bd4a" stroke-width="24" />
  </g>
</svg>
